<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pong Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /*
         * FIX 1 — Body overflow
         * align-items: center on body clips content when viewport is shorter than
         * page content. flex-direction: column + padding lets small screens scroll.
         */
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            background-attachment: fixed;
            font-family: 'Arial', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px 16px;
        }

        /*
         * FIX 2 — Container width matched to canvas
         * Was max-width: 1000px while canvas natural width is 800px.
         * Made scoreboard & controls 200px wider than the canvas — broken column.
         * 840px = 800px canvas + 20px breathing room each side.
         */
        .container {
            display: flex;
            flex-direction: column;
            align-items: stretch;
            gap: 16px;
            width: 100%;
            max-width: 840px;
        }

        /*
         * FIX 3 — Scoreboard balance
         * Was: .highest-score { position: absolute; right: 30px }
         * Nothing counterbalanced it on the left so Player/Computer drifted right.
         * Fix: 3-column grid — [high score | scores | empty mirror col]
         * This keeps the score pair visually centered on the full row.
         */
        .scoreboard {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;
            gap: 16px;
            background: rgba(255, 255, 255, 0.1);
            padding: 18px 24px;
            border-radius: 10px;
            backdrop-filter: blur(10px);
        }

        .highest-score {
            text-align: left;
            color: white;
        }
        .highest-score h3 {
            font-size: 11px;
            font-weight: 600;
            margin-bottom: 4px;
            opacity: 0.7;
            letter-spacing: 0.06em;
            text-transform: uppercase;
        }
        .highest-score p {
            font-size: 28px;
            font-weight: bold;
            color: #ff6b9d;
            text-shadow: 0 0 10px rgba(255, 107, 157, 0.5);
            line-height: 1;
        }

        .scores-center {
            display: flex;
            gap: 48px;
            justify-content: center;
            align-items: center;
        }

        /* Right col — intentionally empty mirror of high score col */
        .scoreboard-right {}

        .score {
            text-align: center;
            color: white;
        }
        .score h2 {
            font-size: 13px;
            margin-bottom: 6px;
            font-weight: 600;
            opacity: 0.75;
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }
        .score p {
            font-size: 52px;
            font-weight: bold;
            color: #ffd700;
            text-shadow: 0 0 12px rgba(255, 215, 0, 0.6);
            line-height: 1;
        }

        /* ── Canvas wrapper ──────────────────────────────────── */
        .game-wrapper {
            position: relative;
            width: 100%;
        }

        /*
         * FIX 4 — Canvas CSS width
         * No explicit CSS width → canvas rendered at intrinsic 800px regardless
         * of container width. width: 100% keeps canvas and scoreboard in sync.
         */
        #gameCanvas {
            display: block;
            width: 100%;
            height: auto;
            aspect-ratio: 2 / 1;
            border: 3px solid #e94560;
            background: linear-gradient(to right, #1a1a2e, #0f3460);
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.5);
            border-radius: 4px;
        }

        .pause-overlay {
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.72);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 100;
            border-radius: 4px;
        }
        .pause-overlay.active {
            display: flex;
        }

        /*
         * FIX 5 — Pause text responsive
         * Was hardcoded 72px — overflows on narrow viewports.
         * clamp: min 2rem, scales with viewport, max 72px.
         */
        .pause-text {
            font-size: clamp(2rem, 8vw, 72px);
            font-weight: bold;
            color: #ffd700;
            text-shadow: 0 0 20px rgba(255, 215, 0, 0.8);
            letter-spacing: 0.15em;
        }

        /* ── Controls ────────────────────────────────────────── */
        .controls {
            text-align: center;
            color: white;
            background: rgba(255, 255, 255, 0.1);
            padding: 14px 24px;
            border-radius: 10px;
            backdrop-filter: blur(10px);
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .controls p {
            margin: 0;
            font-size: 13px;
            opacity: 0.85;
        }

        .buttons {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn {
            padding: 9px 24px;
            font-size: 13px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: 2px solid rgba(255, 255, 255, 0.8);
            border-radius: 5px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            font-weight: bold;
        }
        .btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 18px rgba(255, 255, 255, 0.35);
        }
        .btn:active {
            transform: scale(0.96);
        }
        .btn.pause {
            background: linear-gradient(135deg, #ff6b6b, #ee5a6f);
        }

        .info {
            color: rgba(255, 255, 255, 0.55);
            font-size: 11px;
        }
    </style>
</head>
<body>
<div class="container">

    <!-- Scoreboard: 3-column grid for true visual centering -->
    <div class="scoreboard">
        <div class="highest-score">
            <h3>Best</h3>
            <p id="highestScore">0</p>
        </div>

        <div class="scores-center">
            <div class="score">
                <h2>Player</h2>
                <p id="playerScore">0</p>
            </div>
            <div class="score">
                <h2>Computer</h2>
                <p id="aiScore">0</p>
            </div>
        </div>

        <div class="scoreboard-right"></div>
    </div>

    <!-- Canvas -->
    <div class="game-wrapper">
        <canvas id="gameCanvas" width="800" height="400"></canvas>
        <div class="pause-overlay" id="pauseOverlay">
            <div class="pause-text">PAUSED</div>
        </div>
    </div>

    <!-- Controls -->
    <div class="controls">
        <p>Controls: Arrow Keys ↑↓ or W / S &nbsp;·&nbsp; Spacebar to Pause</p>
        <div class="buttons">
            <button id="pauseBtn" class="btn pause">Pause</button>
            <button id="resetBtn" class="btn">Reset Game</button>
        </div>
        <div class="info">Resolution: <span id="resolutionInfo">800×400</span></div>
    </div>

</div>
<script src="script.js"></script>
</body>
</html>
