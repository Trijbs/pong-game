<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pong Game</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: 'Arial', sans-serif;
            padding: 20px;
        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
            width: 100%;
            max-width: 1000px;
        }

        /* ── Scoreboard ─────────────────────────────────────── */
        .scoreboard {
            display: flex;
            gap: 60px;
            background: rgba(255,255,255,0.1);
            padding: 16px 40px;
            border-radius: 10px;
            backdrop-filter: blur(10px);
            width: 100%;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        .score { text-align: center; color: white; }
        .score h2 { font-size: 16px; margin-bottom: 6px; font-weight: 600; opacity: 0.85; }
        .score p  { font-size: 44px; font-weight: bold; color: #ffd700; text-shadow: 0 0 10px rgba(255,215,0,0.5); line-height: 1; }

        /* Reset button — top-right of scoreboard */
        .reset-corner {
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 6px;
        }

        .reset-corner .btn-small {
            padding: 6px 14px;
            font-size: 11px;
            background: rgba(255,255,255,0.15);
            color: rgba(255,255,255,0.75);
            border: 1px solid rgba(255,255,255,0.3);
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.2s;
            font-weight: bold;
            letter-spacing: 0.05em;
            white-space: nowrap;
        }
        .reset-corner .btn-small:hover {
            background: rgba(255,100,100,0.35);
            border-color: #ff6b6b;
            color: white;
        }

        /* Highest score — top-left of scoreboard */
        .highest-score {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            text-align: left;
            color: white;
        }
        .highest-score h3 { font-size: 10px; font-weight: 600; margin-bottom: 3px; opacity: 0.7; letter-spacing: 0.05em; }
        .highest-score p  { font-size: 26px; font-weight: bold; color: #ff6b9d; text-shadow: 0 0 10px rgba(255,107,157,0.5); margin: 0; }

        /* ── Canvas ─────────────────────────────────────────── */
        .game-wrapper {
            position: relative;
            width: 100%;
            display: flex;
            justify-content: center;
        }

        #gameCanvas {
            border: 3px solid #e94560;
            background: linear-gradient(to right, #1a1a2e, #0f3460);
            max-width: 100%;
            height: auto;
            aspect-ratio: 2 / 1;
            box-shadow: 0 0 30px rgba(0,0,0,0.5);
            display: block;
        }

        .pause-overlay {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.7);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 100;
            border-radius: 3px;
        }
        .pause-overlay.active { display: flex; }
        .pause-text {
            font-size: 64px;
            font-weight: bold;
            color: #ffd700;
            text-shadow: 0 0 20px rgba(255,215,0,0.8);
            letter-spacing: 8px;
        }

        /* ── Controls bar ───────────────────────────────────── */
        .controls {
            text-align: center;
            color: white;
            background: rgba(255,255,255,0.1);
            padding: 14px 24px;
            border-radius: 10px;
            backdrop-filter: blur(10px);
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .controls-hint { font-size: 13px; opacity: 0.8; }

        /* Difficulty selector */
        .diff-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            flex-wrap: wrap;
        }
        .diff-label {
            font-size: 11px;
            opacity: 0.6;
            letter-spacing: 0.1em;
            margin-right: 4px;
        }
        .diff-btn {
            font-family: inherit;
            font-size: 11px;
            font-weight: bold;
            letter-spacing: 0.08em;
            padding: 5px 12px;
            background: transparent;
            border: 1px solid rgba(255,255,255,0.3);
            color: rgba(255,255,255,0.6);
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .diff-btn:hover { border-color: rgba(255,255,255,0.7); color: white; }

        .diff-btn[data-diff="easy"].active    { background: rgba(0,210,120,0.25); border-color: #00d278; color: #00d278; }
        .diff-btn[data-diff="medium"].active  { background: rgba(0,180,255,0.25); border-color: #00b4ff; color: #00b4ff; }
        .diff-btn[data-diff="hard"].active    { background: rgba(255,165,0,0.25);  border-color: #ffa500; color: #ffa500; }
        .diff-btn[data-diff="insane"].active  { background: rgba(255,70,70,0.25);  border-color: #ff4646; color: #ff4646; }

        /* Action buttons */
        .action-row {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .btn {
            padding: 9px 22px;
            font-size: 13px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: 2px solid white;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.25s;
            font-weight: bold;
        }
        .btn:hover  { transform: scale(1.05); box-shadow: 0 0 18px rgba(255,255,255,0.35); }
        .btn:active { transform: scale(0.95); }
        .btn.pause  { background: linear-gradient(135deg, #ff6b6b, #ee5a6f); }
        .btn.mute   { background: linear-gradient(135deg, #4a4a6a, #3a3a5a); min-width: 46px; }

        .info { color: rgba(255,255,255,0.55); font-size: 11px; }
    </style>
</head>
<body>
<div class="container">

    <!-- Scoreboard -->
    <div class="scoreboard">
        <div class="highest-score">
            <h3>BEST</h3>
            <p id="highestScore">0</p>
        </div>
        <div class="score">
            <h2>Player</h2>
            <p id="playerScore">0</p>
        </div>
        <div class="score">
            <h2>Computer</h2>
            <p id="aiScore">0</p>
        </div>
        <div class="reset-corner">
            <button id="resetBtn" class="btn-small">↺ RESET</button>
        </div>
    </div>

    <!-- Canvas -->
    <div class="game-wrapper">
        <canvas id="gameCanvas" width="800" height="400"></canvas>
        <div class="pause-overlay" id="pauseOverlay">
            <div class="pause-text">PAUSED</div>
        </div>
    </div>

    <!-- Controls -->
    <div class="controls">
        <div class="controls-hint">W / S or ↑ / ↓ to move &nbsp;·&nbsp; Space to pause &nbsp;·&nbsp; M to mute</div>

        <!-- Difficulty -->
        <div class="diff-row">
            <span class="diff-label">AI:</span>
            <button class="diff-btn" data-diff="easy">ROOKIE</button>
            <button class="diff-btn active" data-diff="medium">VETERAN</button>
            <button class="diff-btn" data-diff="hard">CALCULATOR</button>
            <button class="diff-btn" data-diff="insane">THE MACHINE</button>
        </div>

        <!-- Action buttons -->
        <div class="action-row">
            <button id="pauseBtn" class="btn pause">Pause</button>
            <button id="muteBtn" class="btn mute">🔊</button>
        </div>

        <div class="info">Resolution: <span id="resolutionInfo">800x400</span></div>
    </div>

</div>
<script src="script.js"></script>
</body>
</html>
