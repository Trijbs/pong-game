<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pong Game</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <div class="scoreboard">
            <div class="score player-score">
                <h2>Player</h2>
                <p id="playerScore">0</p>
            </div>
            <div class="score ai-score">
                <h2>Computer</h2>
                <p id="aiScore">0</p>
            </div>
        </div>

        <div id="gameContainer" class="game-container" tabindex="0">
            <div id="ball" class="ball"></div>
            <div id="playerPaddle" class="paddle player-paddle"></div>
            <div id="aiPaddle" class="paddle ai-paddle"></div>
        </div>

        <div class="controls">
            <p>Controls: Arrow Keys ↑↓ or W/S</p>
            <button id="resetBtn" class="reset-btn">Reset Game</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
