<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pong Game - Responsive</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: 'Arial', sans-serif;
            overflow: hidden;
        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            width: 90%;
            max-width: 900px;
            height: 90vh;
        }

        .scoreboard {
            display: flex;
            gap: 60px;
            background: rgba(255, 255, 255, 0.1);
            padding: 20px 40px;
            border-radius: 10px;
            backdrop-filter: blur(10px);
            width: 100%;
            justify-content: center;
        }

        .score {
            text-align: center;
            color: white;
        }

        .score h2 {
            font-size: 18px;
            margin-bottom: 10px;
            font-weight: 600;
        }

        .score p {
            font-size: 48px;
            font-weight: bold;
            color: #ffd700;
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
        }

        #gameCanvas {
            border: 3px solid #e94560;
            background: linear-gradient(to right, #1a1a2e, #0f3460);
            flex-grow: 1;
            max-width: 100%;
            max-height: 100%;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.5);
            display: block;
        }

        .controls {
            text-align: center;
            color: white;
            background: rgba(255, 255, 255, 0.1);
            padding: 15px 30px;
            border-radius: 10px;
            backdrop-filter: blur(10px);
            width: 100%;
        }

        .controls p {
            margin-bottom: 10px;
            font-size: 14px;
        }

        .reset-btn {
            padding: 10px 25px;
            font-size: 14px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: 2px solid white;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: bold;
        }

        .reset-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.4);
        }

        .reset-btn:active {
            transform: scale(0.95);
        }

        .info {
            color: rgba(255, 255, 255, 0.7);
            font-size: 12px;
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="scoreboard">
            <div class="score">
                <h2>Player</h2>
                <p id="playerScore">0</p>
            </div>
            <div class="score">
                <h2>Computer</h2>
                <p id="aiScore">0</p>
            </div>
        </div>

        <canvas id="gameCanvas"></canvas>

        <div class="controls">
            <p>Controls: Arrow Keys ↑↓ or W/S</p>
            <button id="resetBtn" class="reset-btn">Reset Game</button>
            <div class="info">Resolution: <span id="resolutionInfo">Loading...</span></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
