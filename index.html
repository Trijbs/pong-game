<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pong Game - Responsive</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: 'Arial', sans-serif;
            padding: 20px;
        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            width: 100%;
            max-width: 1000px;
        }

        .scoreboard {
            display: flex;
            gap: 60px;
            background: rgba(255, 255, 255, 0.1);
            padding: 20px 40px;
            border-radius: 10px;
            backdrop-filter: blur(10px);
            width: 100%;
            justify-content: center;
            position: relative;
        }

        .score {
            text-align: center;
            color: white;
        }

        .score h2 {
            font-size: 18px;
            margin-bottom: 10px;
            font-weight: 600;
        }

        .score p {
            font-size: 48px;
            font-weight: bold;
            color: #ffd700;
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
        }

        .highest-score {
            position: absolute;
            right: 30px;
            top: 50%;
            transform: translateY(-50%);
            text-align: right;
            color: white;
        }

        .highest-score h3 {
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 5px;
            opacity: 0.8;
        }

        .highest-score p {
            font-size: 32px;
            font-weight: bold;
            color: #ff6b9d;
            text-shadow: 0 0 10px rgba(255, 107, 157, 0.5);
            margin: 0;
        }

        .game-wrapper {
            position: relative;
            width: 100%;
            display: flex;
            justify-content: center;
        }

        #gameCanvas {
            border: 3px solid #e94560;
            background: linear-gradient(to right, #1a1a2e, #0f3460);
            max-width: 100%;
            height: auto;
            aspect-ratio: 2 / 1;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.5);
            display: block;
        }

        .pause-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 100;
            border-radius: 5px;
        }

        .pause-overlay.active {
            display: flex;
        }

        .pause-text {
            font-size: 72px;
            font-weight: bold;
            color: #ffd700;
            text-shadow: 0 0 20px rgba(255, 215, 0, 0.8);
            letter-spacing: 8px;
        }

        .controls {
            text-align: center;
            color: white;
            background: rgba(255, 255, 255, 0.1);
            padding: 15px 30px;
            border-radius: 10px;
            backdrop-filter: blur(10px);
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .controls p {
            margin: 0;
            font-size: 14px;
        }

        .buttons {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn {
            padding: 10px 25px;
            font-size: 14px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: 2px solid white;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: bold;
        }

        .btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.4);
        }

        .btn:active {
            transform: scale(0.95);
        }

        .btn.pause {
            background: linear-gradient(135deg, #ff6b6b, #ee5a6f);
        }

        .info {
            color: rgba(255, 255, 255, 0.7);
            font-size: 12px;
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="scoreboard">
            <div class="score">
                <h2>Player</h2>
                <p id="playerScore">0</p>
            </div>
            <div class="score">
                <h2>Computer</h2>
                <p id="aiScore">0</p>
            </div>
            <div class="highest-score">
                <h3>Highest Score</h3>
                <p id="highestScore">0</p>
            </div>
        </div>

        <div class="game-wrapper">
            <canvas id="gameCanvas" width="800" height="400"></canvas>
            <div class="pause-overlay" id="pauseOverlay">
                <div class="pause-text">PAUSED</div>
            </div>
        </div>

        <div class="controls">
            <p>Controls: Arrow Keys ↑↓ or W/S | Spacebar to Pause</p>
            <div class="buttons">
                <button id="pauseBtn" class="btn pause">Pause</button>
                <button id="resetBtn" class="btn">Reset Game</button>
            </div>
            <div class="info">Resolution: <span id="resolutionInfo">800x400</span></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
